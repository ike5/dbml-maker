name: dbml-maker

# This file is for local work and for a trial. Do not use this file on a server.
# It has a fixed secret key and no TLS. For a server, use docker-compose.selfhost.yml.

# The app services (migrate, web, worker) use one image (DESIGN.md sections 16.1 and 16.2).
# "docker compose up -d db mailpit" starts only the two services that the developer uses.
x-app: &app
  build:
    context: .
    args:
      APP_RELEASE: local
  image: dbml-maker:local
  environment:
    # Fixed value for local work only. Never use it in production.
    DJANGO_SECRET_KEY: local-only-secret-key-do-not-use-in-production
    DATABASE_URL: postgres://dbml:dbml@db:5432/dbml
    PUBLIC_BASE_URL: http://localhost:${WEB_PORT:-8000}
    EMAIL_HOST: mailpit
    EMAIL_PORT: "1025"
    DEFAULT_FROM_EMAIL: noreply@localhost

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: dbml
      POSTGRES_PASSWORD: dbml
      POSTGRES_DB: dbml
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      # The PostgreSQL 18 image keeps its data below /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbml -d dbml"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"

  migrate:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && python manage.py createcachetable"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    healthcheck:
      # The slim image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: python manage.py procrastinate worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  db-data:
